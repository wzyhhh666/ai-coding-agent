active_provider = "openai"

[agent]
prompt = "react"
max_steps = 10

[sandbox]
mode = "auto"
backend = "auto"
allow_soft_fallback = true

[sandbox.windows]
wsl_distribution = "Ubuntu"
workspace_mount = "/workspace"

[providers.openai]
AGENT_API_KEY = ""
base_url = "https://api.openai.com/v1"
model = "gpt-5"
context_window = 400000
