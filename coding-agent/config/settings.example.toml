active_provider = "openai"

[agent]
prompt = "react"
max_steps = 10
streaming = true
compaction_trigger_ratio = 0.8
compaction_keep_recent_turns = 2

[sandbox]
mode = "auto"
backend = "auto"
allow_soft_fallback = true

[sandbox.resources]
max_processes = 64
memory_mb = 1024
cpu_seconds = 120

[sandbox.network]
mode = "deny-all"
allowed_cidrs = []

[sandbox.windows]
wsl_distribution = "Ubuntu"
workspace_mount = "/workspace"
identity = "auto"

[providers.openai]
AGENT_API_KEY = ""
base_url = "https://api.openai.com/v1"
model = "gpt-5"
context_window = 400000
